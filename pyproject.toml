[project]
name = "tc-juris-mcp"
version = "0.2.2"
description = "MCP local para la sistematizacion jurisprudencial del Tribunal Constitucional del Peru (jurisprudencia.sedetc.gob.pe). No oficial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27",
]

[project.scripts]
tc-juris-mcp = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
